# QRL-L: eligible when state_dim < latent_size / 2 = 256.
model_size: QRL-L
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: standard
      arch: [1024, 1024]
      latent_size: 512
    quasimetric_model:
      projector_arch: [1024]
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [1024, 1024]
      residual: true
actor:
  model:
    input_mode: raw
    arch: [1024, 1024]
goal_set_distance:
  enabled: false
