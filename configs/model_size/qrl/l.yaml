# QRL-L: four-layer plain MLP at the L parameter budget.
model_size: QRL-L
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: standard
      arch: [1184, 1184, 1184, 1184]
      latent_size: 512
    quasimetric_model:
      projector_arch: [1184, 1184, 1184, 1184]
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [1184, 1184, 1184, 1184]
      residual: true
actor:
  model:
    input_mode: raw
    arch: [1184, 1184, 1184, 1184]
goal_set_distance:
  enabled: false
