# QRL-XXXL: thirty-two-layer residual scaling tier.
model_size: QRL-XXXL
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: standard
      arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      mlp_kind: residual
      residual_block_size: 4
      latent_size: 512
    quasimetric_model:
      projector_arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      projector_mlp_kind: residual
      projector_residual_block_size: 4
      projector_activation: silu
      quasimetric_head_spec: iqe(dim=16384,components=512)
    latent_dynamics:
      kind: mlp
      arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      mlp_kind: residual
      residual_block_size: 4
      residual: true
actor:
  model:
    input_mode: raw
    arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
    mlp_kind: residual
    residual_block_size: 4
goal_set_distance:
  enabled: false
