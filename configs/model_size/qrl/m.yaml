# QRL-M: eligible when state_dim < latent_size / 2 = 128.
model_size: QRL-M
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: standard
      arch: [768, 768]
      latent_size: 256
    quasimetric_model:
      projector_arch: [768]
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [768, 768]
      residual: true
actor:
  model:
    input_mode: raw
    arch: [768, 768]
goal_set_distance:
  enabled: false
