# GO-QRL-S: QRL-S capacity with a matched goal/non-goal encoder split.
model_size: GO-QRL-S
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: split
      arch: [512, 512]
      latent_size: 128
      split_parameterization: match_qrl
      min_goal_parameter_ratio: 0.125
      branch_normalization: none
    quasimetric_model:
      projector_arch: [512]
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [512, 512]
      residual: true
actor:
  model:
    input_mode: split_latent
    arch: [512, 512]
goal_set_distance:
  enabled: false
