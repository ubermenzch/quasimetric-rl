# GO-QRL-L: QRL-L capacity with a matched goal/non-goal encoder split.
model_size: GO-QRL-L
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: split
      arch: [1024, 1024]
      latent_size: 512
      split_parameterization: match_qrl
      min_goal_parameter_ratio: 0.125
      branch_normalization: none
    quasimetric_model:
      projector_arch: [1024]
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [1024, 1024]
      residual: true
actor:
  model:
    input_mode: split_latent
    arch: [1024, 1024]
goal_set_distance:
  enabled: false
