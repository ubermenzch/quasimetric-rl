# GO-QRL-XL: experimental scale above GO-QRL-L for explicit capacity sweeps.
model_size: GO-QRL-XL
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: split
      arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      mlp_kind: residual
      residual_block_size: 4
      latent_size: 512
      split_parameterization: match_qrl
      min_goal_parameter_ratio: 0.125
      branch_normalization: none
    quasimetric_model:
      projector_arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      projector_mlp_kind: residual
      projector_residual_block_size: 4
      projector_activation: silu
      quasimetric_head_spec: iqe(dim=4096,components=128)
    latent_dynamics:
      kind: mlp
      arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
      mlp_kind: residual
      residual_block_size: 4
      residual: true
actor:
  model:
    input_mode: split_latent
    arch: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
    mlp_kind: residual
    residual_block_size: 4
goal_set_distance:
  enabled: false
