# CQRL-M-Residual: two-layer residual blocks with LayerNorm and SiLU.
# AntNavigate (D=29, A=8, G=2): 4,391,126 trainable parameters.
# Explicit alternative to m; the original plain/ReLU M preset is retained.
model_size: CQRL-M-Residual
num_critics: 1
training_schedule: joint
quasimetric_critic:
  model:
    encoder:
      kind: split
      arch: [556, 556]
      mlp_kind: residual
      residual_block_size: 2
      latent_size: 256
      split_parameterization: match_qrl
      min_goal_parameter_ratio: 0.125
      # Integer widths are coarser at M; permit 1% goal-branch budget error.
      split_max_relative_budget_error: 0.01
      branch_normalization: none
    quasimetric_model:
      projector_arch: [556, 556]
      projector_mlp_kind: residual
      projector_residual_block_size: 2
      projector_activation: silu
      quasimetric_head_spec: iqe(dim=2048,components=64)
    latent_dynamics:
      kind: mlp
      arch: [556, 556]
      mlp_kind: residual
      residual_block_size: 2
      residual: true
actor:
  model:
    input_mode: split_latent
    arch: [556, 556]
    mlp_kind: residual
    residual_block_size: 2
goal_set_distance:
  enabled: false
